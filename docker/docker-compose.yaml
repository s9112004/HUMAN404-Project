services:
  # ----------------------------------------
  # 1. 核心大腦 (API Service)
  # test
  # ----------------------------------------
  api:
    image: langgenius/dify-api:latest
    restart: always
    environment:
      # 讀取 .env 變數
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # 關鍵：啟用 pgvector
      VECTOR_STORE: pgvector
      SECRET_KEY: ${SECRET_KEY}
      CONSOLE_API_URL: ${CONSOLE_API_URL}
      CONSOLE_WEB_URL: ${CONSOLE_WEB_URL}
      SERVICE_API_URL: ${SERVICE_API_URL}
      APP_API_URL: ${APP_API_URL}
      STORAGE_TYPE: ${STORAGE_TYPE}
      STORAGE_LOCAL_ROOT: ${STORAGE_LOCAL_ROOT}
      DIFY_PLUGIN_DAEMON_URL: http://plugin_daemon:5002
    depends_on:
      - db
      - redis
      - plugin_daemon
    volumes:
      # 讓上傳的 PDF 檔案落地儲存
      - ./volumes/app/storage:/app/api/storage

  # ----------------------------------------
  # 2. 任務執行者 (Worker)
  # ----------------------------------------
  worker:
    image: langgenius/dify-api:latest
    restart: always
    command: celery -A app.celery worker -P gevent -c 1 -Q dataset,generation,mail --loglevel INFO
    environment:
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_HOST: db
      DB_DATABASE: ${POSTGRES_DB}
      REDIS_HOST: redis
      VECTOR_STORE: pgvector
      SECRET_KEY: ${SECRET_KEY}
      STORAGE_TYPE: ${STORAGE_TYPE}
      STORAGE_LOCAL_ROOT: ${STORAGE_LOCAL_ROOT}
      DIFY_PLUGIN_DAEMON_URL: http://plugin_daemon:5002
    depends_on:
      - db
      - redis
      - plugin_daemon
    volumes:
      - ./volumes/app/storage:/app/api/storage

  # ----------------------------------------
  # 3. 前端介面 (Web UI)
  # ----------------------------------------
  web:
    image: langgenius/dify-web:latest
    restart: always
    ports:
      - "3000:3000"
    environment:
      CONSOLE_API_URL: ${CONSOLE_API_URL}
      APP_API_URL: ${APP_API_URL}

  # ----------------------------------------
  # 4. 記憶中樞 (Database) - P3 重點看護
  # ----------------------------------------
  db:
    image: pgvector/pgvector:pg16
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      # [重要] 資料庫檔案寫入本機 HUMAN404-Project/docker/volumes/db
      - ./volumes/db/data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  # ----------------------------------------
  # 5. 極速快取 (Redis)
  # ----------------------------------------
  redis:
    image: redis:6-alpine
    restart: always
    volumes:
      - ./volumes/redis/data:/data
    command: redis-server --appendonly yes --requirepass ""

  # ----------------------------------------
  # 6. 對外窗口 (Nginx)
  # ----------------------------------------
  nginx:
    image: nginx:latest
    ports:
      - "80:80"
      - "5001:5001"
    depends_on:
      - api
      - web
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d

  # ----------------------------------------
  # 7. 插件守護進程 (Plugin Daemon)
  # ----------------------------------------
  plugin_daemon:
    image: langgenius/dify-plugin-daemon:0.4.1-local
    restart: always
    environment:
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SERVER_KEY: ${SECRET_KEY}
      MAX_REQUESTS: 10000
      MAX_REQUESTS_JITTER: 1000
      MAX_LIFETIME: 3600
      MAX_LIFETIME_JITTER: 600
      WORKERS: 1
      PYTHONPATH: /app
      SSRF_PROXY_HTTP_URL: http://ssrf_proxy:3128
      SSRF_PROXY_HTTPS_URL: http://ssrf_proxy:3128
      DIFY_INNER_API_URL: http://api:5001
      DIFY_INNER_API_KEY: ${SECRET_KEY}
      PLUGIN_REMOTE_INSTALLING_HOST: 0.0.0.0
      PLUGIN_REMOTE_INSTALLING_PORT: 5003
      PLUGIN_WORKING_PATH: /app/plugin_workspace
    depends_on:
      - db
      - ssrf_proxy

  # ----------------------------------------
  # 8. SSRF Proxy
  # ----------------------------------------
  ssrf_proxy:
    image: ubuntu/squid:latest
    restart: always
    ports:
      - "3128:3128"
    volumes:
      - ./volumes/ssrf_proxy/squid.conf:/etc/squid/squid.conf
